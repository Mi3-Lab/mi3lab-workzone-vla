defaults:
  - sft_base
  - /models/student_2b_v4@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: vqa
  - override /vla_processor@data.val_dataset.vla_preprocess_args: vqa
  - _self_

data:
  train_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_roadwork
    parquet_name: train.parquet
    vla_preprocess_args:
      generation_mode: false

  val_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_roadwork
    parquet_name: val.parquet
    vla_preprocess_args:
      generation_mode: false

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
    # Cosmos-2B base language tokens must NOT be corrupted.
    # lm_head is tied to embed_tokens — freeze both via this single key.
    vlm.model.language_model.embed_tokens: 0.0
    expert: 0.0

  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4

  learning_rate: 5e-5
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 5e-6
  warmup_steps: 200

  num_train_epochs: 3

  save_steps: 500
  save_total_limit: 3
  logging_steps: 10

  eval_strategy: "no"
  load_best_model_at_end: false

  dataloader_num_workers: 4
  dataloader_pin_memory: true

  deepspeed: configs/deepspeed/zero2_fast.json

  ddp_find_unused_parameters: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_stage4_v4

task_name: alpamayo_stage4v4_student_sft_clean_init
