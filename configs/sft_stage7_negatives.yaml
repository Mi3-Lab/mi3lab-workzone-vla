defaults:
  - sft_base
  - /models/student_2b_v8@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: vqa
  - override /vla_processor@data.val_dataset.vla_preprocess_args: vqa
  - _self_

# Stage 7: HARD NEGATIVES + restauracao do gate. Continua do stage6
# (checkpoint-2194). Dado: lingoqa_stage7 = 10k negativos BDD (todas as 6
# perguntas de work zone com respostas negativas canonicas) + 2.5k
# gate-positivos + 8k replay do egomix_v3.
#
# Motivacao: validacao 2026-07-08 mostrou o modelo respondendo afirmativo a
# qualquer pergunta de obra em cena limpa (gate 95% Yes em BDD limpo, 100%
# APPROACHING em rodovia noturna), capacidade que o Cosmos-2B base tinha
# (0% falso Yes) e o SFT sem negativos destruiu.

data:
  train_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_stage7
    parquet_name: train.parquet
    vla_preprocess_args:
      generation_mode: false

  val_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_stage7
    parquet_name: val.parquet
    vla_preprocess_args:
      generation_mode: false

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
    vlm.model.language_model.embed_tokens: 0.0
    expert: 0.0

  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4

  # Refinamento leve: LR menor que o stage6 (1.5e-5) — objetivo e' corrigir
  # o vies de negativos sem mexer no que ja funciona.
  learning_rate: 1e-5
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 2e-6
  warmup_steps: 100

  num_train_epochs: 1

  save_steps: 400
  save_total_limit: 2
  logging_steps: 10

  eval_strategy: "no"
  load_best_model_at_end: false

  dataloader_num_workers: 4
  dataloader_pin_memory: true

  deepspeed: configs/deepspeed/zero2_fast.json

  ddp_find_unused_parameters: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_stage7_negatives

task_name: alpamayo_stage7_negatives
