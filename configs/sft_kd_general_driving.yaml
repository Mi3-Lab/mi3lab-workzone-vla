defaults:
  - sft_base
  - override /vla_processor@data.train_dataset.vla_preprocess_args: nav
  - override /vla_processor@data.val_dataset.vla_preprocess_args: nav
  - _self_

# KD "puro" — teacher = Alpamayo-1.5-10B-A1-format original (SEM fine-tune
# nenhum, sem ROADWork), dataset = PhysicalAI-AV (direção geral, sem
# work zone). Objetivo: ver como um student 2B destilado do professor puro
# se comporta em trajetória geral, antes de qualquer especialização em
# work zone — comparar depois com o resultado do SFT direto da Fase A.
#
# Diferença da tentativa Stage 3 KD anterior (archive/configs/sft_stage3_kd.yaml):
# aquela usava teacher já fine-tuned em ROADWork + dataset LingoQA (Q&A de
# work zone); esta usa o teacher original e trajetória real do PhysicalAI-AV.
#
# NÃO passar reasoning_metadata aqui: filter_clips_by_event_t0s() do
# PhysicalAIAVDatasetLocalInterface descarta qualquer clipe sem entrada no
# parquet de reasoning (só ~124 de 3744 clipes têm) — isso já derrubou o
# chunk 214 pra 0 clipes na Fase A. use_default_keyframe já vem true do
# sft_base.yaml (mantido aqui, não usamos anotação de evento).

kd:
  teacher_checkpoint: /data/wesleyferreiramaia/wokzone-alpamayo/models/Alpamayo-1.5-10B-A1-format
  teacher_vlm_path:   /data/wesleyferreiramaia/wokzone-alpamayo/models/Cosmos-Reason2-8B
  alpamayo_base_path: /data/wesleyferreiramaia/wokzone-alpamayo/models/Alpamayo-1.5-10B-A1-format
  student_vlm_path:   /data/wesleyferreiramaia/wokzone-alpamayo/models/Cosmos-Reason2-2B

data:
  train_dataset:
    _target_: alpamayo.data.pai.PAIDataset
    _recursive_: false
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [214, 224, 276, 317, 420, 727, 728, 968, 982,
                1519, 1657, 1984, 2277, 2368, 2372, 2447, 2599, 2634, 2868,
                15, 17, 34, 120, 133, 137, 139, 148, 149, 153,
                174, 270, 609, 1786, 1790, 1799, 1862, 2443, 3125, 3126]
    vla_preprocess_args:
      generation_mode: false

  val_dataset:
    _target_: alpamayo.data.pai.PAIDataset
    _recursive_: false
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [2868, 3126]
    vla_preprocess_args:
      generation_mode: true

trainer:
  # Student: treina VLM inteiro, encoder visual devagar, expert congelado
  # (pesos base do Alpamayo, mesma decisão da Fase A)
  lr_multiplier:
    vlm.model.visual: 0.1
    expert: 0.0

  kd_lambda: 0.5        # 50% SFT (GT) + 50% KD (teacher logits), LLAVADI
  kd_temperature: 0.7

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 2e-5
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 2e-6
  warmup_steps: 100

  # 3 epocas iniciais: loss 25->3.0, minADE mediana 5.9m (restrito) vs teacher
  # 0.4m — subtreinado, continuando ate 9 (resume de checkpoint-1404)
  num_train_epochs: 9

  save_steps: 500
  save_total_limit: 2
  save_only_model: true
  logging_steps: 10

  eval_strategy: "no"
  load_best_model_at_end: false

  dataloader_num_workers: 4
  dataloader_pin_memory: true

  # Teacher (10B) + student (2B) no mesmo processo/GPU — sem DeepSpeed
  # (mesma decisão da tentativa Stage 3 KD original)
  deepspeed: null

  ddp_find_unused_parameters: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/kd_general_driving

task_name: alpamayo_kd_general_driving
