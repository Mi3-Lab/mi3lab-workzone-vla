# Stage AR1-2B-distill: refina o expert de acao (checkpoint-684) com targets
# do professor Alpamayo-10B (Phase-1 output-level distillation, mix GT/teacher
# com filtro de qualidade). Baseline medido: professor minADE 1.26m vs nosso
# 4.62m no chunk 3126 -- gap de 3.7x que este treino tenta fechar.
defaults:
  - sft_base
  - /models/ar1_5_expert_2b_distill@model
  - _self_

data:
  train_dataset:
    _recursive_: false
    _target_: training.pai_teacher_distill.PAIDatasetTeacherDistill
    labels_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/teacher_traj_labels
    max_teacher_ade: 1.5
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [15, 17, 34, 120, 133, 137, 139, 148, 149, 153, 174, 214, 224,
                270, 276, 317, 420, 609, 727, 728, 968, 982, 1519, 1657, 1786,
                1790, 1799, 1862, 1984, 2277, 2368, 2372, 2443, 2447, 2599,
                2634, 2868, 3125]
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [3126]
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: true

trainer:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  # refino: LR menor que o treino GT-direto (1e-4)
  learning_rate: 3e-5
  warmup_steps: 50
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1e-6
  num_train_epochs: 3
  save_steps: 200
  save_total_limit: 2
  save_only_model: true
  logging_steps: 10
  eval_strategy: "no"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  deepspeed: null
  ddp_find_unused_parameters: true
  gradient_checkpointing: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_action_2b_distill

task_name: alpamayo_action_2b_distill
