# Stage AR1-2B: treina a cabeca de acao real do Alpamayo (flow matching)
# em cima do nosso VLM 2B (workzone stage7_1), GT direto contra egomotion
# real (PhysicalAI-AV, 39 chunks locais -- mesmos chunk_ids da receita
# oficial sft_stage2_nav.yaml). VLM fica congelado (cotrain_vlm: false).
defaults:
  - sft_base
  - /models/ar1_5_expert_2b@model
  - _self_

data:
  train_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [15, 17, 34, 120, 133, 137, 139, 148, 149, 153, 174, 214, 224,
                270, 276, 317, 420, 609, 727, 728, 968, 982, 1519, 1657, 1786,
                1790, 1799, 1862, 1984, 2277, 2368, 2372, 2443, 2447, 2599,
                2634, 2868, 3125]
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [3126]
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: true

trainer:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  warmup_steps: 100
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1e-6
  num_train_epochs: 3
  save_steps: 200
  save_total_limit: 2
  save_only_model: true
  logging_steps: 10
  eval_strategy: "no"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  # VLM congelado -> nao precisa do overhead do zero2 pesado do stage1
  deepspeed: null
  ddp_find_unused_parameters: true
  gradient_checkpointing: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_action_2b_egomotion

task_name: alpamayo_action_2b_egomotion
