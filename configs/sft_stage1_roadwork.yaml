defaults:
  - sft_base
  - /models/ar1_5_base@model
  - /wandb: default
  - override /vla_processor@data.train_dataset.vla_preprocess_args: vqa
  - override /vla_processor@data.val_dataset.vla_preprocess_args: vqa
  - _self_

data:
  train_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    _recursive_: false
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_roadwork
    parquet_name: train.parquet
    local_dir: null
    chunk_ids: null
    use_default_keyframe: null
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    _recursive_: false
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_roadwork
    parquet_name: val.parquet
    local_dir: null
    chunk_ids: null
    use_default_keyframe: null
    vla_preprocess_args:
      generation_mode: true

trainer:
  lr_multiplier:
    vlm.model.visual: 0.0
    expert: 0.0
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 5e-6
  warmup_steps: 200
  num_train_epochs: 6
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  save_steps: 2000
  save_total_limit: 2
  logging_steps: 10
  dataloader_num_workers: 8
  report_to: wandb
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_stage1_roadwork
  deepspeed: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_stage1_roadwork

task_name: alpamayo_r1_5_sft_roadwork_vqa
