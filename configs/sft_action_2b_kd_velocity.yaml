# Stage AR1-2B-KDvel: destilacao do CAMPO DE VELOCIDADE do professor 10B.
#
# Dataset = PAIDataset puro (GT). O sinal do professor NAO vem mais de um alvo
# de trajetoria trocado (isso foi a destilacao anterior, ganho ~0.7%), e sim de
# um termo de loss extra: MSE entre a velocidade que o professor preve e a que o
# aluno preve, NO MESMO ponto de ruido. Supervisao densa em vez de um unico alvo.
#
# loss = flow_matching(aluno, GT) + kd_weight * MSE(v_aluno, v_professor)
defaults:
  - sft_base
  - /models/ar1_5_expert_2b_kd_velocity@model
  - _self_

data:
  train_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [15, 17, 34, 120, 133, 137, 139, 148, 149, 153, 174, 214, 224,
                270, 276, 317, 420, 609, 727, 728, 968, 982, 1519, 1657, 1786,
                1790, 1799, 1862, 1984, 2277, 2368, 2372, 2443, 2447, 2599,
                2634, 2868, 3125]
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: /data/wesleyferreiramaia/wokzone-alpamayo/data/PhysicalAI-AV
    chunk_ids: [3126]
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: true

trainer:
  # professor (10B) + aluno (2B) + optimizer residentes na mesma GPU -> batch 1
  # e o passo cabe folgado em A100-80GB; o accum recompoe o batch efetivo.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 3e-5
  warmup_steps: 50
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1e-6
  num_train_epochs: 3
  save_steps: 200
  save_total_limit: 2
  save_only_model: true
  logging_steps: 10
  eval_strategy: "no"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  deepspeed: null
  ddp_find_unused_parameters: true
  gradient_checkpointing: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_action_2b_kd_velocity

task_name: alpamayo_action_2b_kd_velocity
