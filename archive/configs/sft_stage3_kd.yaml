defaults:
  - sft_base
  - override /vla_processor@data.train_dataset.vla_preprocess_args: vqa
  - override /vla_processor@data.val_dataset.vla_preprocess_args: vqa
  - _self_

# ── KD-specific parameters ────────────────────────────────────────────────────
kd:
  # Teacher: Stage 1 v2 fine-tuned VLM (10B, frozen)
  teacher_checkpoint: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_stage1_roadwork_v2/checkpoint-4500
  teacher_vlm_path:   /data/wesleyferreiramaia/wokzone-alpamayo/models/Cosmos-Reason2-8B

  # Student: fresh Cosmos-Reason2-2B with Alpamayo trajectory architecture
  alpamayo_base_path: /data/wesleyferreiramaia/wokzone-alpamayo/models/Alpamayo-1.5-10B-A1-format
  student_vlm_path:   /data/wesleyferreiramaia/wokzone-alpamayo/models/Cosmos-Reason2-2B

# ── Dataset: same as Stage 1 ──────────────────────────────────────────────────
data:
  train_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_pathways
    parquet_name: train.parquet
    vla_preprocess_args:
      generation_mode: false

  val_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_pathways
    parquet_name: val.parquet
    vla_preprocess_args:
      generation_mode: false

# ── Trainer ───────────────────────────────────────────────────────────────────
trainer:
  # Student: train VLM fully, freeze visual encoder and expert
  lr_multiplier:
    vlm.model.visual: 0.1   # slow visual encoder adaptation
    expert: 0.0             # trajectory expert frozen (base Alpamayo weights)

  # KD hyperparameters (LLAVADI paper)
  kd_lambda: 0.5        # 50% SFT loss + 50% KD loss
  kd_temperature: 0.7   # τ=0.7 optimal for VLMs per LLAVADI

  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-5       # higher than Stage 1 — student learning from scratch
  warmup_steps: 100
  num_train_epochs: 3
  save_steps: 500
  save_total_limit: 3
  logging_steps: 10
  eval_steps: 500
  eval_strategy: steps
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  dataloader_num_workers: 4
  # DeepSpeed disabled — teacher + student on same GPUs requires ZeRO ≤ 2
  deepspeed: null
  ddp_find_unused_parameters: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/kd_stage3_roadwork_v2

task_name: alpamayo_stage3_kd_roadwork
