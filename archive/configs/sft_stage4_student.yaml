defaults:
  - sft_base
  - /models/student_2b_kd@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: vqa
  - override /vla_processor@data.val_dataset.vla_preprocess_args: vqa
  - _self_

data:
  train_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_roadwork
    parquet_name: train.parquet
    vla_preprocess_args:
      generation_mode: false

  val_dataset:
    _target_: alpamayo.data.lingoqa.LingoQADataset
    local_dir: null
    data_root: /data/wesleyferreiramaia/wokzone-alpamayo/data/roadwork/lingoqa_roadwork
    parquet_name: val.parquet
    vla_preprocess_args:
      generation_mode: false

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
    expert: 0.0

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-6        # baixo — modelo já tem conhecimento do domínio via KD
  warmup_steps: 50
  num_train_epochs: 1        # 1 época suficiente para bridging
  save_steps: 2000
  save_total_limit: 2
  logging_steps: 10
  eval_steps: 2000
  eval_strategy: steps
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  dataloader_num_workers: 4
  deepspeed: null
  ddp_find_unused_parameters: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  report_to: none

evaluate:
  max_eval_steps: -1
  metric_runner: null

paths:
  output_dir: /data/wesleyferreiramaia/wokzone-alpamayo/checkpoints/sft_stage4_student

task_name: alpamayo_stage4_student_sft
